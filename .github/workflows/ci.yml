name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[azure,dev,ide]"
      - name: Compile package
        run: python -m compileall -q agentbus
      - name: Run full test suite
        run: python -m pytest
      - name: Run deterministic core evaluation
        run: python -m agentbus.eval run --suite core-offline --variant durable-parallel-fake
      - name: Run true offline intelligence-enabled control-plane lifecycle
        if: matrix.python == '3.12'
        run: python -m agentbus.control.acceptance
      - name: Check patch whitespace
        run: git diff --check

  tool-runtime-security:
    name: Tool runtime security / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline tool runtime dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify tool protocol policy and filesystem boundaries
        run: >-
          python -m pytest
          tests/test_tool_protocol.py
          tests/test_tool_registry.py
          tests/test_tool_policy.py
          tests/test_policy_aware_git_tools.py
          tests/test_filesystem_security.py
          tests/test_filesystem_read_operations.py
          tests/test_filesystem_mutations.py
      - name: Verify sandbox limits and process-tree cleanup
        run: >-
          python -m pytest
          tests/test_sandbox_process.py
          tests/test_sandbox_platform.py
          tests/test_sandbox_environment.py
          tests/test_sandbox_limits.py
          tests/test_sandbox_output.py
      - name: Verify offline MCP trust boundaries and cleanup
        run: >-
          python -m pytest
          tests/test_mcp_client.py
          tests/test_mcp_config.py
          tests/test_mcp_importer.py
          tests/test_mcp_stdio_transport.py
          tests/test_mcp_http_transport.py
          tests/test_mcp_tools.py
          tests/test_agentbus_mcp_server.py
      - name: Run real offline tool and intelligence control acceptance
        run: python -m agentbus.control.acceptance
      - name: Check patch whitespace
        run: git diff --check

  replay-integrity:
    name: Replay integrity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline replay dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify trace models and deterministic recording
        run: >-
          python -m pytest
          tests/test_trace_models.py
          tests/test_trace_context.py
          tests/test_trace_recorder.py
          tests/test_trace_runtime.py
          tests/test_trace_persistence.py
          tests/test_trace_state_records.py
      - name: Verify snapshot and provenance integrity
        run: >-
          python -m pytest
          tests/test_trace_storage.py
          tests/test_trace_redaction.py
          tests/test_trace_provenance.py
          tests/test_trace_sealing.py
          tests/test_trace_retention.py
      - name: Verify archive and regression fixture security
        run: >-
          python -m pytest
          tests/test_trace_archive_export.py
          tests/test_trace_archive_import.py
          tests/test_regression_fixtures.py
      - name: Verify replay checkpoints policy drift and comparisons
        run: >-
          python -m pytest
          tests/test_replay_classification.py
          tests/test_replay_engine.py
          tests/test_replay_checkpoints.py
          tests/test_replay_tools.py
          tests/test_replay_forks.py
          tests/test_replay_comparison.py
          tests/test_replay_service.py
          tests/test_control_replay_supervisor.py
      - name: Verify cross-platform environment path and line-ending drift
        run: python -m pytest tests/test_replay_nondeterminism.py
      - name: Check patch whitespace
        run: git diff --check

  repository-intelligence:
    name: Repository intelligence / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline intelligence dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify multilingual parsers and monorepo discovery
        run: >-
          python -m pytest
          tests/test_intelligence_parser_base.py
          tests/test_intelligence_parser_registry.py
          tests/test_intelligence_parser_python_symbols.py
          tests/test_intelligence_parser_python_references.py
          tests/test_intelligence_parser_python_frameworks.py
          tests/test_intelligence_parser_typescript_symbols.py
          tests/test_intelligence_parser_typescript_references.py
          tests/test_intelligence_parser_typescript_frameworks.py
          tests/test_intelligence_parser_java_symbols.py
          tests/test_intelligence_parser_java_references.py
          tests/test_intelligence_parser_java_frameworks.py
          tests/test_intelligence_parser_go_symbols.py
          tests/test_intelligence_parser_go_references.py
          tests/test_intelligence_parser_go_frameworks.py
          tests/test_intelligence_discovery_inventory.py
          tests/test_intelligence_discovery_monorepo.py
      - name: Verify migrations incremental invalidation and freshness
        run: >-
          python -m pytest
          tests/test_intelligence_storage.py
          tests/test_intelligence_migrations.py
          tests/test_intelligence_indexer.py
          tests/test_intelligence_indexer_operations.py
          tests/test_intelligence_incremental_indexer.py
          tests/test_intelligence_invalidation.py
          tests/test_intelligence_freshness.py
          tests/test_intelligence_watcher.py
          tests/test_intelligence_operations.py
          tests/test_intelligence_operation_lease.py
      - name: Verify graph retrieval impact and test selection
        run: >-
          python -m pytest
          tests/test_intelligence_graph.py
          tests/test_intelligence_resolution.py
          tests/test_intelligence_architecture.py
          tests/test_intelligence_ownership.py
          tests/test_intelligence_search.py
          tests/test_intelligence_semantic.py
          tests/test_intelligence_hybrid.py
          tests/test_intelligence_context.py
          tests/test_intelligence_impact.py
          tests/test_intelligence_test_impact.py
      - name: Verify path security control APIs runtime and protocol freshness
        run: >-
          python -m pytest
          tests/test_intelligence_traversal.py
          tests/test_intelligence_service.py
          tests/test_control_intelligence.py
          tests/test_runtime_intelligence.py
          tests/test_control_protocol.py
      - name: Run deterministic multilingual intelligence evaluation
        run: >-
          python -m agentbus.eval run
          --suite repository-intelligence
          --variant deterministic
      - name: Check patch whitespace
        run: git diff --check

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install control plane
        run: python -m pip install -e ".[ide]"
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Verify generated protocol
        working-directory: extensions/vscode
        run: npm run protocol:check
      - name: Compile extension
        working-directory: extensions/vscode
        run: npm run compile
      - name: Lint extension
        working-directory: extensions/vscode
        run: npm run lint
      - name: Run extension unit tests
        working-directory: extensions/vscode
        run: npm test
      - name: Run real intelligence and replay VS Code Electron integration
        working-directory: extensions/vscode
        run: xvfb-run -a npm run test:integration
      - name: Package VSIX without publishing
        working-directory: extensions/vscode
        run: npm run package
      - name: Audit VSIX contents
        working-directory: extensions/vscode
        run: npm run package:audit

  package:
    name: Package smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Audit distribution contents
        run: python scripts/verify_distribution.py dist
      - name: Install wheel in a fresh virtual environment
        run: python scripts/install_smoke.py dist
      - name: Run offline release acceptance
        run: python -m agentbus.eval run --suite release-offline --variant durable-parallel-fake
      - name: Check patch whitespace
        run: git diff --check
