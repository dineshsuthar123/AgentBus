name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[azure,dev,ide]"
      - name: Compile package
        run: python -m compileall -q agentbus
      - name: Run full test suite
        run: python -m pytest
      - name: Run deterministic core evaluation
        run: python -m agentbus.eval run --suite core-offline --variant durable-parallel-fake
      - name: Check patch whitespace
        run: git diff --check

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install control plane
        run: python -m pip install -e ".[ide]"
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Verify generated protocol
        working-directory: extensions/vscode
        run: npm run protocol:check
      - name: Compile lint and unit test
        working-directory: extensions/vscode
        run: npm run compile && npm run lint && npm test
      - name: Run VS Code integration
        working-directory: extensions/vscode
        run: xvfb-run -a npm run test:integration
      - name: Package and audit VSIX
        working-directory: extensions/vscode
        run: npm run package && npm run package:audit

  package:
    name: Package smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Audit distribution contents
        run: python scripts/verify_distribution.py dist
      - name: Install wheel in a fresh virtual environment
        run: python scripts/install_smoke.py dist
      - name: Run offline release acceptance
        run: python -m agentbus.eval run --suite release-offline --variant durable-parallel-fake
      - name: Check patch whitespace
        run: git diff --check
