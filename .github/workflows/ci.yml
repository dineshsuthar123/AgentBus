name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AGENTBUS_PROVIDER: deterministic
  AGENTBUS_ENABLE_PROVIDER_FALLBACK: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-core:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            name: Python 3.11 Core
          - python: "3.12"
            name: Python 3.12 Core
          - python: "3.13"
            name: Python 3.13 Core
          - python: "3.14"
            name: Python 3.14 Core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Compile package
        run: python -m compileall -q agentbus
      - name: Run full test suite
        run: python -m pytest
      - name: Check patch whitespace
        run: git diff --check

  linux-core:
    name: Linux Core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Compile package
        run: python -m compileall -q agentbus
      - name: Run deterministic core evaluation
        run: python -m agentbus.eval run --suite core-offline --variant durable-parallel-fake
      - name: Check patch whitespace
        run: git diff --check

  windows-core:
    name: Windows Core / ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Compile package
        run: python -m compileall -q agentbus
      - name: Run full test suite
        run: python -m pytest
      - name: Run deterministic core evaluation
        if: matrix.python == '3.12'
        run: python -m agentbus.eval run --suite core-offline --variant durable-parallel-fake
      - name: Check patch whitespace
        run: git diff --check

  package-audit:
    name: Package Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build distributions twice without isolation
        run: |
          python -m build --no-isolation --outdir dist-one
          python -m build --no-isolation --outdir dist-two
      - name: Audit package contents and reproducibility
        run: >-
          python -m agentbus.release_packaging
          dist-one/*.whl dist-one/*.tar.gz
          --root . --compare-dir dist-two
      - name: Verify distribution smoke contract
        run: python scripts/verify_distribution.py dist-one
      - name: Check patch whitespace
        run: git diff --check

  product-acceptance:
    name: Product Acceptance / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline acceptance prerequisites
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Run wheel-installed product acceptance
        run: python -m agentbus.product_acceptance --repeat 2
      - name: Check patch whitespace
        run: git diff --check

  rc-acceptance:
    name: RC Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline RC prerequisites
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Run local release-candidate acceptance
        run: python -m agentbus.rc_acceptance
      - name: Check patch whitespace
        run: git diff --check

  control-acceptance:
    name: Control Acceptance / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install control-plane dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Run true-offline control lifecycle
        run: python -m agentbus.control.acceptance
      - name: Check patch whitespace
        run: git diff --check

  repository-intelligence:
    name: Repository Intelligence / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install intelligence dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify multilingual parsing and repository discovery
        run: >-
          python -m pytest
          tests/test_intelligence_parser_base.py
          tests/test_intelligence_parser_registry.py
          tests/test_intelligence_parser_python_symbols.py
          tests/test_intelligence_parser_typescript_symbols.py
          tests/test_intelligence_parser_java_symbols.py
          tests/test_intelligence_parser_go_symbols.py
          tests/test_intelligence_discovery_inventory.py
          tests/test_intelligence_discovery_monorepo.py
      - name: Verify indexing graph retrieval impact and context
        run: >-
          python -m pytest
          tests/test_intelligence_storage.py
          tests/test_intelligence_migrations.py
          tests/test_intelligence_indexer.py
          tests/test_intelligence_incremental_indexer.py
          tests/test_intelligence_freshness.py
          tests/test_intelligence_graph.py
          tests/test_intelligence_search.py
          tests/test_intelligence_impact.py
          tests/test_intelligence_test_impact.py
          tests/test_intelligence_context.py
          tests/test_intelligence_service.py
          tests/test_runtime_intelligence.py
      - name: Run deterministic intelligence evaluation
        run: >-
          python -m agentbus.eval run
          --suite repository-intelligence
          --variant deterministic
      - name: Check patch whitespace
        run: git diff --check

  replay-integrity:
    name: Replay Integrity / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install replay dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify trace provenance archives and retention
        run: >-
          python -m pytest
          tests/test_trace_models.py
          tests/test_trace_recorder.py
          tests/test_trace_runtime.py
          tests/test_trace_persistence.py
          tests/test_trace_storage.py
          tests/test_trace_redaction.py
          tests/test_trace_provenance.py
          tests/test_trace_sealing.py
          tests/test_trace_archive_export.py
          tests/test_trace_archive_import.py
          tests/test_trace_retention.py
      - name: Verify offline replay checkpoints forks and comparisons
        run: >-
          python -m pytest
          tests/test_replay_classification.py
          tests/test_replay_engine.py
          tests/test_replay_checkpoints.py
          tests/test_replay_tools.py
          tests/test_replay_forks.py
          tests/test_replay_comparison.py
          tests/test_replay_service.py
          tests/test_replay_nondeterminism.py
          tests/test_regression_fixtures.py
      - name: Check patch whitespace
        run: git diff --check

  security-boundaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            name: Linux Security Boundaries
          - os: windows-latest
            platform: Windows
            name: Windows Security Boundaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install security-test dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Verify tool policy filesystem Git and platform boundaries
        run: >-
          python -m pytest
          tests/test_tool_registry.py
          tests/test_tool_policy.py
          tests/test_policy_aware_git_tools.py
          tests/test_filesystem_security.py
          tests/test_filesystem_read_operations.py
          tests/test_filesystem_mutations.py
          tests/test_git_adversarial.py
          tests/test_windows_platform_matrix.py
          tests/test_posix_platform_matrix.py
      - name: Check patch whitespace
        run: git diff --check

  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install property-test dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify generated invariants
        run: python -m pytest tests/property
      - name: Check patch whitespace
        run: git diff --check

  parser-robustness:
    name: Parser Robustness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install parser-test dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify bounded multilingual parser behavior
        run: >-
          python -m pytest
          tests/fuzz/test_python_parser_fuzz.py
          tests/fuzz/test_typescript_parser_fuzz.py
          tests/fuzz/test_java_go_parser_fuzz.py
      - name: Check patch whitespace
        run: git diff --check

  protocol-robustness:
    name: Protocol Robustness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install protocol-test dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Verify malformed control and tool messages fail closed
        run: >-
          python -m pytest
          tests/fuzz/test_control_protocol_fuzz.py
          tests/fuzz/test_tool_protocol_fuzz.py
          tests/fuzz/test_policy_capability_escalation_fuzz.py
      - name: Check patch whitespace
        run: git diff --check

  sandbox-stress:
    name: Sandbox Stress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install sandbox-test dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify supervised process cleanup under stress
        run: >-
          python -m pytest
          tests/test_sandbox_process.py
          tests/test_sandbox_process_stress.py
          tests/test_controlled_failure_injection.py
      - name: Check patch whitespace
        run: git diff --check

  mcp-adversarial-local:
    name: MCP Adversarial Local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install local MCP test dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Verify hostile synthetic local MCP peers
        run: >-
          python -m pytest
          tests/test_mcp_adversarial.py
          tests/test_mcp_client.py
          tests/test_mcp_stdio_transport.py
          tests/test_mcp_http_transport.py
      - name: Check patch whitespace
        run: git diff --check

  sqlite-contention:
    name: SQLite Contention
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install storage-test dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify bounded contention and transaction recovery
        run: python -m pytest tests/test_sqlite_contention.py
      - name: Check patch whitespace
        run: git diff --check

  repository-scale:
    name: Repository Scale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install scale-test dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify index graph context and worktree scale boundaries
        run: >-
          python -m pytest
          tests/test_index_scale_benchmark.py
          tests/test_intelligence_graph_scale.py
          tests/test_intelligence_context_scale.py
          tests/test_real_repository_benchmarks.py
          tests/test_worktree_stress.py
      - name: Run medium synthetic repository benchmark
        run: >-
          python -m agentbus.cli benchmark index-scale
          --size medium --iterations 1 --json
      - name: Check patch whitespace
        run: git diff --check

  release-security:
    name: Release Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install defensive-validation dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Verify defensive security scorecard contracts
        run: >-
          python -m pytest
          tests/test_defensive_security_scorecard.py
          tests/test_release_security.py
      - name: Audit release inputs and controlled local boundaries
        run: python -m agentbus.release_security
      - name: Check patch whitespace
        run: git diff --check

  performance-smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify performance scorecard policy
        run: >-
          python -m pytest
          tests/test_product_benchmark.py
          tests/test_performance_scorecard.py
      - name: Capture local performance baseline
        run: >-
          python -m agentbus.cli benchmark all
          --files 20 --iterations 1
          --output "${{ runner.temp }}/agentbus-performance-baseline.json" --json
      - name: Compare local performance smoke
        run: >-
          python -m agentbus.cli benchmark all
          --files 20 --iterations 1
          --baseline "${{ runner.temp }}/agentbus-performance-baseline.json" --json
      - name: Check patch whitespace
        run: git diff --check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install security-test dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Verify sandbox and MCP integration boundaries
        run: >-
          python -m pytest
          tests/test_tool_protocol.py
          tests/test_sandbox_process.py
          tests/test_sandbox_platform.py
          tests/test_sandbox_environment.py
          tests/test_sandbox_limits.py
          tests/test_sandbox_output.py
          tests/test_mcp_client.py
          tests/test_mcp_config.py
          tests/test_mcp_importer.py
          tests/test_mcp_stdio_transport.py
          tests/test_mcp_http_transport.py
          tests/test_mcp_tools.py
          tests/test_agentbus_mcp_server.py
      - name: Check patch whitespace
        run: git diff --check

  vscode-compile:
    name: VS Code Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install protocol generator dependencies
        run: python -m pip install -e ".[ide]"
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Verify generated protocol
        working-directory: extensions/vscode
        run: npm run protocol:check
      - name: Compile extension
        working-directory: extensions/vscode
        run: npm run compile
      - name: Lint extension
        working-directory: extensions/vscode
        run: npm run lint

  vscode-unit:
    name: VS Code Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Run extension unit tests
        working-directory: extensions/vscode
        run: npm test

  vscode-electron:
    name: VS Code Electron
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install control plane and test runtime
        run: python -m pip install -e ".[dev,ide]"
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Run control integration in Electron
        working-directory: extensions/vscode
        run: xvfb-run -a npm run test:integration
      - name: Run fresh-profile product acceptance
        working-directory: extensions/vscode
        run: xvfb-run -a npm run test:product

  vsix-audit:
    name: VSIX Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Package VSIX without publishing
        working-directory: extensions/vscode
        run: npm run package
      - name: Audit VSIX contents
        working-directory: extensions/vscode
        run: npm run package:audit

  documentation-checks:
    name: Documentation Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation-test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify public docs community files and commands
        run: >-
          python -m pytest
          tests/test_documentation.py
          tests/test_community_files.py
          tests/test_ci_release_gates.py
      - name: Check patch whitespace
        run: git diff --check

  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install release-readiness dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Install extension dependencies for protocol freshness
        working-directory: extensions/vscode
        run: npm ci
      - name: Run complete public beta acceptance
        run: python -m agentbus.beta_acceptance
      - name: Run non-publishing release readiness checks
        run: python -m agentbus.cli release-check --fast
      - name: Check patch whitespace
        run: git diff --check
