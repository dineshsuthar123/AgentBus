name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AGENTBUS_PROVIDER: deterministic
  AGENTBUS_ENABLE_PROVIDER_FALLBACK: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-core:
    name: Python Core / ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Compile package
        run: python -m compileall -q agentbus
      - name: Run full test suite
        run: python -m pytest
      - name: Check patch whitespace
        run: git diff --check

  linux-core:
    name: Linux Core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Compile package
        run: python -m compileall -q agentbus
      - name: Run full test suite
        run: python -m pytest
      - name: Run deterministic core evaluation
        run: python -m agentbus.eval run --suite core-offline --variant durable-parallel-fake
      - name: Check patch whitespace
        run: git diff --check

  windows-core:
    name: Windows Core / ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Compile package
        run: python -m compileall -q agentbus
      - name: Run full test suite
        run: python -m pytest
      - name: Run deterministic core evaluation
        if: matrix.python == '3.12'
        run: python -m agentbus.eval run --suite core-offline --variant durable-parallel-fake
      - name: Check patch whitespace
        run: git diff --check

  package-build:
    name: Package Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build distributions twice without isolation
        run: |
          python -m build --no-isolation --outdir dist-one
          python -m build --no-isolation --outdir dist-two
      - name: Audit package contents and reproducibility
        run: >-
          python -m agentbus.release_packaging
          dist-one/*.whl dist-one/*.tar.gz
          --root . --compare-dir dist-two
      - name: Verify distribution smoke contract
        run: python scripts/verify_distribution.py dist-one
      - name: Check patch whitespace
        run: git diff --check

  clean-installation:
    name: Clean Installation / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline acceptance prerequisites
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Run wheel-installed product acceptance
        run: python -m agentbus.product_acceptance
      - name: Check patch whitespace
        run: git diff --check

  control-acceptance:
    name: Control Acceptance / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install control-plane dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Run true-offline control lifecycle
        run: python -m agentbus.control.acceptance
      - name: Check patch whitespace
        run: git diff --check

  repository-intelligence:
    name: Repository Intelligence / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install intelligence dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify multilingual parsing and repository discovery
        run: >-
          python -m pytest
          tests/test_intelligence_parser_base.py
          tests/test_intelligence_parser_registry.py
          tests/test_intelligence_parser_python_symbols.py
          tests/test_intelligence_parser_typescript_symbols.py
          tests/test_intelligence_parser_java_symbols.py
          tests/test_intelligence_parser_go_symbols.py
          tests/test_intelligence_discovery_inventory.py
          tests/test_intelligence_discovery_monorepo.py
      - name: Verify indexing graph retrieval impact and context
        run: >-
          python -m pytest
          tests/test_intelligence_storage.py
          tests/test_intelligence_migrations.py
          tests/test_intelligence_indexer.py
          tests/test_intelligence_incremental_indexer.py
          tests/test_intelligence_freshness.py
          tests/test_intelligence_graph.py
          tests/test_intelligence_search.py
          tests/test_intelligence_impact.py
          tests/test_intelligence_test_impact.py
          tests/test_intelligence_context.py
          tests/test_intelligence_service.py
          tests/test_runtime_intelligence.py
      - name: Run deterministic intelligence evaluation
        run: >-
          python -m agentbus.eval run
          --suite repository-intelligence
          --variant deterministic
      - name: Check patch whitespace
        run: git diff --check

  replay:
    name: Replay / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install replay dependencies
        run: python -m pip install -e ".[dev,ide]"
      - name: Verify trace provenance archives and retention
        run: >-
          python -m pytest
          tests/test_trace_models.py
          tests/test_trace_recorder.py
          tests/test_trace_runtime.py
          tests/test_trace_persistence.py
          tests/test_trace_storage.py
          tests/test_trace_redaction.py
          tests/test_trace_provenance.py
          tests/test_trace_sealing.py
          tests/test_trace_archive_export.py
          tests/test_trace_archive_import.py
          tests/test_trace_retention.py
      - name: Verify offline replay checkpoints forks and comparisons
        run: >-
          python -m pytest
          tests/test_replay_classification.py
          tests/test_replay_engine.py
          tests/test_replay_checkpoints.py
          tests/test_replay_tools.py
          tests/test_replay_forks.py
          tests/test_replay_comparison.py
          tests/test_replay_service.py
          tests/test_replay_nondeterminism.py
          tests/test_regression_fixtures.py
      - name: Check patch whitespace
        run: git diff --check

  security-audit:
    name: Security Audit / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install security-test dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Verify tool policy filesystem and Git boundaries
        run: >-
          python -m pytest
          tests/test_tool_protocol.py
          tests/test_tool_registry.py
          tests/test_tool_policy.py
          tests/test_policy_aware_git_tools.py
          tests/test_filesystem_security.py
          tests/test_filesystem_read_operations.py
          tests/test_filesystem_mutations.py
      - name: Verify sandbox process and MCP boundaries
        run: >-
          python -m pytest
          tests/test_sandbox_process.py
          tests/test_sandbox_platform.py
          tests/test_sandbox_environment.py
          tests/test_sandbox_limits.py
          tests/test_sandbox_output.py
          tests/test_mcp_client.py
          tests/test_mcp_config.py
          tests/test_mcp_importer.py
          tests/test_mcp_stdio_transport.py
          tests/test_mcp_http_transport.py
          tests/test_mcp_tools.py
          tests/test_agentbus_mcp_server.py
      - name: Audit tracked release inputs
        run: python -m agentbus.release_security
      - name: Check patch whitespace
        run: git diff --check

  vscode-compile:
    name: VS Code Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install protocol generator dependencies
        run: python -m pip install -e .
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Verify generated protocol
        working-directory: extensions/vscode
        run: npm run protocol:check
      - name: Compile extension
        working-directory: extensions/vscode
        run: npm run compile
      - name: Lint extension
        working-directory: extensions/vscode
        run: npm run lint

  vscode-unit:
    name: VS Code Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Run extension unit tests
        working-directory: extensions/vscode
        run: npm test

  vscode-electron:
    name: VS Code Electron
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install control plane and test runtime
        run: python -m pip install -e ".[dev,ide]"
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Run control integration in Electron
        working-directory: extensions/vscode
        run: xvfb-run -a npm run test:integration
      - name: Run fresh-profile product acceptance
        working-directory: extensions/vscode
        run: xvfb-run -a npm run test:product

  vsix-audit:
    name: VSIX Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Package VSIX without publishing
        working-directory: extensions/vscode
        run: npm run package
      - name: Audit VSIX contents
        working-directory: extensions/vscode
        run: npm run package:audit

  documentation-checks:
    name: Documentation Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation-test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify public docs community files and commands
        run: >-
          python -m pytest
          tests/test_documentation.py
          tests/test_community_files.py
          tests/test_ci_release_gates.py
      - name: Check patch whitespace
        run: git diff --check

  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install release-readiness dependencies
        run: python -m pip install -e ".[dev,ide,mcp]"
      - name: Install extension dependencies for protocol freshness
        working-directory: extensions/vscode
        run: npm ci
      - name: Run complete public beta acceptance
        run: python -m agentbus.beta_acceptance
      - name: Run non-publishing release readiness checks
        run: python -m agentbus.cli release-check --fast
      - name: Check patch whitespace
        run: git diff --check
