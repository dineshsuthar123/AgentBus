[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "syndra"
dynamic = ["version"]
description = "Safe execution infrastructure for autonomous software engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dinesh Suthar" }]
maintainers = [{ name = "Syndra contributors" }]
keywords = ["agents", "developer-tools", "safety", "software-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "jsonschema>=4",
  "pydantic>=2,<3",
  "requests>=2.31",
]

[project.optional-dependencies]
azure = ["openai>=1.66"]
dev = [
  "build>=1.2",
  "hypothesis>=6.112",
  "httpx>=0.28",
  "pytest>=8",
  "setuptools>=69",
  "wheel>=0.43",
]
entra = ["azure-identity>=1.17"]
ide = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
mcp = ["httpx>=0.28,<1"]
all = [
  "azure-identity>=1.17",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=1.66",
  "uvicorn>=0.34,<1",
]

[project.scripts]
syndra = "syndra.cli:main"
syndra-eval = "syndra.eval:main"
agentbus = "agentbus.cli:main"
agentbus-eval = "agentbus.eval:main"

[project.urls]
Documentation = "https://github.com/dineshsuthar123/Syndra#readme"
Issues = "https://github.com/dineshsuthar123/Syndra/issues"
Repository = "https://github.com/dineshsuthar123/Syndra"

[tool.setuptools.dynamic]
version = { attr = "agentbus._version.__version__" }

[tool.setuptools.packages.find]
include = ["syndra*", "agentbus*"]

[tool.setuptools.package-data]
syndra = ["py.typed"]

agentbus = ["py.typed"]
"agentbus.evaluation" = [
  "*.json",
  "fixtures_data/**/*",
  "fixtures_data/generated-artifact/.gitignore",
  "fixtures_data/repository-intelligence-mixed/.gitignore",
]
"agentbus.validation" = ["corpus.json"]
